services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fastapi_rebuild

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fastapi_rebuild"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
